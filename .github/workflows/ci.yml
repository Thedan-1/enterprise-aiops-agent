name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-ci.txt
      - name: Validate evaluation dataset
        run: python eval/validate_dataset.py
      - name: Run unit and integration tests
        env:
          EMBEDDER_PROVIDER: mock_hash
          RERANKER_PROVIDER: heuristic
          LLM_PROVIDER: mock
        run: pytest tests -q

